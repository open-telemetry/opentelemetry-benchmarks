[package]
name = "opentelemetry-benchmarks"
version = "0.0.0"
edition = "2021"
publish = false

# Scenario S001: counter increment, API-only.
# See ../../scenarios/S001-counter-increment-api-only.md for the definition.
#
# API-only: this harness depends on the `opentelemetry` crate only (no
# `opentelemetry_sdk`), so `global::meter(...)` returns the crate's built-in
# no-op meter. The recorded version is the `opentelemetry` crate version.
[dependencies]
opentelemetry = "0.32.0"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false }

[[bench]]
name = "s001_counter_increment_api_only"
harness = false

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
