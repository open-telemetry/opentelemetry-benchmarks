# Pins the Rust toolchain used to build and run this harness, so benchmark
# results are reproducible and comparable release-over-release regardless of the
# toolchain the CI runner happens to ship. rustup reads this file automatically
# (the CI runner already has rustup installed), so no separate "setup Rust" step
# or action is needed. Bump the channel to re-baseline on a newer compiler.
[toolchain]
channel = "1.97.0"
profile = "minimal"
